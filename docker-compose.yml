version: '3.8'

services:
  # Backend API
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ecomm-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      # Use local MongoDB on host or MongoDB Atlas
      MONGODB_URI: ${MONGODB_URI:-mongodb://host.docker.internal:27017/construction-ecommerce}
      JWT_SECRET: ${JWT_SECRET:-your-jwt-secret-change-this}
      SESSION_SECRET: ${SESSION_SECRET:-your-session-secret-change-this}
      # MSG91 Configuration
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY}
      MSG91_SENDER_ID: ${MSG91_SENDER_ID}
      MSG91_ROUTE: ${MSG91_ROUTE:-4}
      MSG91_COUNTRY: ${MSG91_COUNTRY:-91}
      MSG91_OTP_ENABLED: ${MSG91_OTP_ENABLED:-true}
      OTP_EXPIRY_MINUTES: ${OTP_EXPIRY_MINUTES:-5}
      # Other configs
      N8N_ENABLED: ${N8N_ENABLED:-false}
      ABANDONED_CART_ENABLED: ${ABANDONED_CART_ENABLED:-true}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      # MinIO Storage Configuration
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-storage.chardeevari.in}
      MINIO_PORT: ${MINIO_PORT:-443}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-true}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-https://storage.chardeevari.in}
    networks:
      - ecomm-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ecomm-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - ecomm-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ecomm-network:
    driver: bridge
