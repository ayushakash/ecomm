# Link scrapers (no JS execution) get server-rendered OG tags for product pages.
map $http_user_agent $is_link_scraper {
    default               0;
    ~*facebookexternalhit 1;
    ~*whatsapp            1;
    ~*twitterbot          1;
    ~*telegrambot         1;
    ~*linkedinbot         1;
    ~*slackbot            1;
    ~*discordbot          1;
    ~*pinterest           1;
    ~*skypeuripreview     1;
}

# Client-side routes of the React app (client/src/App.js). Prerendered pages are
# served from their own HTML files first; when no snapshot exists (new product,
# PRERENDER=false build, logged-in areas) a known route gets the neutral SPA shell
# (/200.html). Anything else is a real 404 — never the homepage (soft 404).
# Keep in sync with App.js routes and landing slugs in pages/landing/landingConfig.js.
map $uri $is_spa_route {
    default 0;
    ~^/(products|calculator|blog|contact|about|aaj-ka-rate|privacy-policy|delete-account)$ 1;
    ~^/(cement-price-ranchi|tmt-steel-price-ranchi|bricks-supplier-ranchi|sand-supplier-ranchi|gitti-rate-ranchi|construction-materials-ranchi)$ 1;
    "~^/products/[a-fA-F0-9]{24}$" 1;
    ~^/blog/[a-z0-9-]+$ 1;
    ~^/(login|register|merchant-register|pending-approval|cart|checkout|order-success)$ 1;
    ~^/(profile|admin|merchant)(/.*)?$ 1;
}

server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;
    # Relative Location headers: this container sits behind the HTTPS host proxy.
    absolute_redirect off;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml application/xml+rss application/json application/ld+json application/manifest+json image/svg+xml image/x-icon;
    # /api responses arrive proxied from the backend; compress them too.
    gzip_proxied any;

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # API proxy to backend
    location /api {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Dynamic sitemap lives on the backend (routes/sitemap.js)
    location = /sitemap.xml {
        proxy_pass http://backend:5000/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Short app link: redirect target is set in Admin → Settings (routes/appLink.js)
    location = /app {
        proxy_pass http://backend:5000/app;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket support
    location /socket.io {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|webp|avif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA shell must revalidate every visit: without this, browsers heuristically
    # cache index.html and returning visitors run stale hashed bundles for days.
    # NOTE: add_header in a location discards server-level headers, so the
    # security headers are restated wherever HTML is served.
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }

    # Product pages: scrapers -> backend OG renderer; everyone else -> the
    # prerendered product page, or the neutral SPA shell for products added
    # after the last build (never the homepage snapshot in index.html).
    location ~ "^/products/([a-fA-F0-9]{24})$" {
        if ($is_link_scraper) {
            rewrite ^/products/(.*)$ /api/og/products/$1 last;
        }
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        # /index.html is only reached on PRERENDER=false builds, where it is the shell.
        try_files $uri/index.html /200.html /index.html;
    }

    location = /privacy {
        return 301 /privacy-policy;
    }

    # React app — prerendered pages are served directly; one canonical form
    # without trailing slash; unknown URLs fall through to @spa.
    location / {
        rewrite ^/(.+)/$ /$1 permanent;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        try_files $uri $uri/index.html @spa;
    }

    # Known client-side route without a snapshot → SPA shell; anything else → 404.
    location @spa {
        if ($is_spa_route = 0) {
            return 404;
        }
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        # react-snap keeps the pristine shell as 200.html (index.html becomes the
        # homepage snapshot); PRERENDER=false builds only have index.html.
        try_files /200.html /index.html =404;
    }

    # Shell and not-found page are only served via the rules above.
    location = /200.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }

    # Prerendered not-found page (NotFound.js, noindex) served with HTTP 404.
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
        try_files /404.html /index.html =404;
    }

    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
