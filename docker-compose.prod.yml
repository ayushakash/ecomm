version: '3.8'

# Production Docker Compose - Uses images from Docker Hub
# Usage: docker-compose -f docker-compose.prod.yml up -d

services:
  # Backend API (from Docker Hub)
  backend:
    image: YOUR_DOCKERHUB_USERNAME/ecomm-backend:latest
    container_name: ecomm-backend
    restart: always
    ports:
      - "5000:5000"
    env_file:
      - .env.production
    networks:
      - ecomm-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:5000/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend (from Docker Hub)
  frontend:
    image: YOUR_DOCKERHUB_USERNAME/ecomm-frontend:latest
    container_name: ecomm-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    networks:
      - ecomm-network
    volumes:
      # Mount SSL certificates if using HTTPS
      - ./ssl:/etc/nginx/ssl:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  ecomm-network:
    driver: bridge
